name: Blue Cloud Pediatric Surgery Centers
description: 'Blue Cloud Pediatric Surgery Centers operates accredited ambulatory surgery centers
  specializing in pediatric and special-needs dental and oral surgery care delivered under general
  anesthesia. Positioning itself as the largest pediatric surgery center company in the United States,
  Blue Cloud partners with dentists and payors across multiple U.S. locations with a mission to expand
  access to care, exemplify safety and quality, and reduce costs to patients and payors. Headquartered
  in The Woodlands, Texas, the company is a portfolio company of Norwest Venture Partners. Blue Cloud is
  a healthcare services provider and does not publish any public developer API, SDK, or documentation
  surface; this profile is maintained for network identity and demand-side coverage.'
